name: Publish to MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GitHub OIDC login to the MCP Registry; no stored secret

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA (v4). Checked with DugganUSA check-package (github-actions): allow, pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install mcp-publisher 1.7.6
        # Hash pinned here, not fetched from the release page: a checksum downloaded next to the file
        # only proves the two arrived together (see the 2026-10-19 OVHcloud CLI release swap).
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.6/mcp-publisher_linux_amd64.tar.gz"
          echo "bcc96ca630cae4cf503b4550bd4a17462d42ad4819273bee56f4385bb059ddee  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Tag must match server.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(jq -r .version server.json)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME != server.json $have"; exit 1; }
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
